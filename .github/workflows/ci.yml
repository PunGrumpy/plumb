name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-environment
      # check: Ultracite for the repo, gofmt and go vet for every Go module.
      - run: bun turbo run check test build
      - name: Cross-compile every release platform
        run: make -C apps/cli dist
