# GoReleaser runs after the release workflow tags a version. It builds the
# same static binaries as `make dist` and publishes them as a GitHub release.
version: 2
project_name: plumb

builds:
  - dir: apps/cli
    main: ./cmd/plumb
    binary: plumb
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{ .Tag }}
      # Points the update notice at this repository's latest release.
      - -X main.updateURL={{ with envOrDefault "GITHUB_REPOSITORY" "" }}https://api.github.com/repos/{{ . }}/releases/latest{{ end }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md]

checksum:
  name_template: checksums.txt

# The release workflow passes the version's section of apps/cli/CHANGELOG.md, which
# Changesets writes, as --release-notes. Keep the changelog pipe enabled:
# disabling it also skips reading --release-notes.
