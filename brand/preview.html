<!doctype html><meta charset="utf-8"><title>plumb brand</title>
<style>
body{margin:0;font:14px -apple-system,Inter,sans-serif;background:#fafafa;color:#000}
.row{display:flex;gap:24px;padding:24px;align-items:center;flex-wrap:wrap}
.tile{background:#fff;border:1px solid #eaeaea;border-radius:12px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.dark{background:#000;border-color:#333;color:#fff}
.label{font-size:12px;color:#666}.dark .label{color:#888}
</style>
<div class="row">
 <div class="tile"><img src="mark-black.svg" width="160"><span class="label">mark, 160 px</span></div>
 <div class="tile dark"><img src="mark-white.svg" width="160"><span class="label">mark on black</span></div>
 <div class="tile"><img src="icon.svg" width="160"><span class="label">app icon</span></div>
 <div class="tile"><div style="display:flex;gap:16px;align-items:end"><img src="icon.svg" width="64"><img src="icon.svg" width="32"><img src="favicon.svg" width="32"><img src="favicon.svg" width="16"></div><span class="label">64, 32 px icon, 32 and 16 px favicon</span></div>
</div>
<div class="row">
 <div class="tile"><img src="wordmark-black.svg" width="440"><span class="label">wordmark</span></div>
 <div class="tile dark"><img src="wordmark-white.svg" width="440"><span class="label">wordmark on black</span></div>
 <div class="tile"><img src="wordmark-black.svg" width="120"><span class="label">wordmark, 120 px</span></div>
</div>
<div class="row"><img src="og.svg" width="900" style="border-radius:12px"></div>
