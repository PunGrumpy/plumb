name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l apps/cli)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:" && echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
        working-directory: apps/cli
      - run: go test -race ./...
        working-directory: apps/cli
      - name: Cross-compile every release platform
        run: make -C apps/cli dist
