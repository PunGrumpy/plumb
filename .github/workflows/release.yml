name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # While .changeset/ holds changesets, keep the "Version Packages" PR up
      # to date. Merging it bumps package.json and writes CHANGELOG.md.
      - uses: changesets/action@v1
        id: changesets
        with:
          version: npm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # After that PR is merged, no changesets are left and package.json holds
      # a version without a tag. Tag it and keep its CHANGELOG.md section as
      # the release notes.
      - name: Tag the new version
        id: tag
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$version" = "0.0.0" ] || git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "v$version"
          git push origin "v$version"
          awk -v v="$version" '$0 == "## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - if: steps.tag.outputs.created == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: steps.tag.outputs.created == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
