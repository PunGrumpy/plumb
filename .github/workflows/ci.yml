name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # check: gofmt and go vet for every Go module.
      - run: bun turbo run check test build
      - name: Cross-compile every release platform
        run: make -C apps/cli dist
